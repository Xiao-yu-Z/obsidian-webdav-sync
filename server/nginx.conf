# =====================================================================
# Nginx WebDAV 配置（Alpine + nginx-mod-http-dav-ext）
# 支持方法：PUT / DELETE / MKCOL / COPY / MOVE / PROPFIND / OPTIONS
# 适合作为 Obsidian 私有同步后端。
# =====================================================================

# 加载 WebDAV 扩展模块（提供 PROPFIND / OPTIONS）
load_module /usr/lib/nginx/modules/ngx_http_dav_ext_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    charset utf-8;  # 避免中文文件名乱码

    # ---------- 大文件上传支持 ----------
    client_max_body_size     0;      # 0 = 不限制；可按需改为 2g / 5g
    client_body_buffer_size  16m;
    client_body_temp_path    /tmp/client_temp;
    client_body_timeout      300s;
    client_header_timeout    300s;
    proxy_read_timeout       300s;
    send_timeout             300s;

    # ===================== HTTPS WebDAV（默认启用） =====================
    # 证书由 entrypoint.sh 自动生成自签名证书（挂载的 ./ssl 目录）。
    # 自签名证书能加密传输（密码不再明文），但客户端需信任该证书；
    # 如需「零信任弹窗」，请用受信任证书替换 ./ssl（见使用说明 3.6 的 Let's Encrypt 方案）。
    server {
        listen 8080 ssl;
        server_name _;

        # ---------- TLS 证书（默认自签名，自动生成） ----------
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 数据根目录（映射到宿主机 ./data 卷）
        root /data;
        autoindex on;

        # ---------- 账号密码认证 ----------
        auth_basic "Obsidian WebDAV";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # ---------- WebDAV 方法 ----------
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;     # 扩展模块提供
        dav_access user:rw group:rw all:r;
        create_full_put_path on;             # PUT 时自动创建中间目录

        # 健康检查（无需认证）
        location = /healthz {
            auth_basic off;
            return 200 "ok\n";
        }
    }

    # ===================== HTTP WebDAV（明文端口 · 安卓专用） =====================
    # 为什么需要它：
    #   Android 7+ 的系统策略是「App 只信任系统内置 CA」，用户手动安装的证书默认不生效，
    #   因此自签名证书在安卓 Obsidian 上会被拒（CERT_AUTHORITY_INVALID）。
    #   该端口用明文提供同一份数据、同一套账号，供手机端填写 http://服务器IP:8081/ 使用。
    #
    # 风险提示：Basic 认证的账号密码只做 Base64 编码，在公网上等同于明文传输。
    #   仅建议在「手机流量/家庭 WiFi 也信任」的自用场景下启用，并请使用强密码。
    #   追求安全请改用受信任证书（Let's Encrypt）后把地址换成 https://8080。
    #
    # 不需要它时：注释掉本 server 块，并删掉 docker-compose.yml 里的 "8081:8081" 一行。
    server {
        listen 8081;
        server_name _;

        # 数据根目录（与 HTTPS 端口共用同一份数据）
        root /data;
        autoindex on;

        # 账号密码认证（与 HTTPS 端口同一份 .htpasswd）
        auth_basic "Obsidian WebDAV";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # WebDAV 方法
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access user:rw group:rw all:r;
        create_full_put_path on;

        location = /healthz {
            auth_basic off;
            return 200 "ok\n";
        }
    }
}
